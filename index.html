<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Генератор Номеров копия</title>
    <style>
        /* Подключаем оригинальный шрифт для автономеров */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Фирменный тёмный размытый градиент как в приложении */
            background: radial-gradient(circle at center, #24242d 0%, #0f0f12 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 16px;
            padding-top: calc(14px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .screen {
            width: 100%;
            max-width: 375px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Верхняя навигация */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 6px 16px 6px;
        }

        .burger-menu {
            color: #8b8b8f;
            font-size: 24px;
            cursor: pointer;
        }

        .currency-box {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            color: #a5a5aa;
            font-weight: 500;
        }

        .currency-box span {
            color: #ffffff;
        }

        /* Баннер нового рекорда */
        .banner-record {
            background: rgba(33, 26, 12, 0.7);
            border: 1px solid #c39a3c;
            border-radius: 10px;
            padding: 11px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 75px;
            backdrop-filter: blur(5px);
        }

        .banner-text {
            font-size: 13px;
            color: #cbb88a;
            line-height: 1.4;
        }

        .banner-text strong {
            color: #ffffff;
        }

        .banner-btn {
            color: #e5b842;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        /* Блок редкости и цены */
        .rarity-price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .rarity-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .rarity-title {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }

        .rarity-dots {
            display: flex;
            gap: 3px;
        }

        .rarity-dot-item {
            width: 13px;
            height: 3.5px;
            border-radius: 1px;
        }

        .gold-price {
            font-size: 23px;
            font-weight: 700;
            color: #e5b842;
        }
        /* Идеальная копия оригинального автономера */
        .plate-container {
            background: #101011;
            padding: 3px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .plate-body-white {
            background: #e2e2e4;
            color: #111111;
            border-radius: 5px;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border: 3.5px solid #111111;
        }

        .plate-left-side {
            font-size: 58px;
            display: flex;
            align-items: center;
            gap: 1px;
            font-family: 'PT Sans', -apple-system, sans-serif;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .plate-left-side .letter {
            font-size: 34px;
            margin-top: 18px;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
        }

        .plate-right-side {
            border-left: 3.5px solid #111111;
            height: 100%;
            width: 76px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 3px 4px;
        }

        .region-bold-text {
            font-size: 38px;
            line-height: 0.9;
            font-weight: 700;
            font-family: 'PT Sans', -apple-system, sans-serif;
        }

        .rus-flag-container {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
        }

        .flag-box-mini {
            width: 15px;
            height: 9.5px;
            display: flex;
            flex-direction: column;
            border: 0.5px solid #666;
        }
        .flag-box-mini .w { background: #fff; flex: 1; }
        .flag-box-mini .b { background: #0024a5; flex: 1; }
        .flag-box-mini .r { background: #e30000; flex: 1; }

        /* Описания совпадений строго по центру */
        .center-labels-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: center;
            width: 100%;
            min-height: 100px;
            margin-bottom: auto;
        }

        .label-row-item {
            font-size: 15px;
            color: #646468;
            font-weight: 400;
            text-align: center;
        }

        /* Нижний блок меню */
        .bottom-pill-box {
            background: rgba(24, 24, 26, 0.8);
            border-radius: 18px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            border: 1px solid #28282a;
            width: fit-content;
            margin: 40px auto 4px auto;
        }

        .pill-flag-img {
            width: 16px;
            height: 10px;
            border: 0.5px solid #333;
        }

        .sub-link-label {
            font-size: 12px;
            color: #646468;
            text-decoration: none;
            text-align: center;
            margin-bottom: 12px;
        }

        .plate-spin-shake {
            animation: plate-vibration 0.04s infinite alternate;
        }
        @keyframes plate-vibration {
            0% { transform: translateY(-1px); }
            100% { transform: translateY(1px); }
        }
    </style>
</head>
<body>

    <div class="screen">
        <!-- Топ бар -->
        <div class="top-nav">
            <span class="burger-menu">☰</span>
            <div class="currency-box">
                <span id="cashDisplay">14 696 357 ₽</span>
                <span>🔹 <span id="gemsDisplay">0</span></span>
            </div>
        </div>

        <!-- Баннер рекорда один в один -->
        <div class="banner-record">
            <div class="banner-text">
                Новый рекорд: номер за <span id="recordLabel">32 681 <br>250 ₽!</span>
            </div>
            <a href="#" class="banner-btn" id="sellActionLink">Открыть ➔</a>
        </div>

        <!-- Строка редкости и цены -->
        <div class="rarity-price-row">
            <div class="rarity-block">
                <span class="rarity-title" id="rarityTextLabel" style="color: #ca8a04;">Легендарный</span>
                <div class="rarity-dots" id="dotsGrid">
                    <div class="rarity-dot-item" style="background: #ca8a04;"></div>
                    <div class="rarity-dot-item" style="background: #ca8a04;"></div>
                    <div class="rarity-dot-item" style="background: #ca8a04;"></div>
                    <div class="rarity-dot-item" style="background: #ca8a04;"></div>
                    <div class="rarity-dot-item" style="background: #ca8a04;"></div>
                </div>
            </div>
            <div class="gold-price" id="priceLabelText">32 681 250 ₽</div>
        </div>
        <!-- Сам автономер -->
        <div class="plate-container" id="plateTriggerBox">
            <div class="plate-body-white" id="plateCoreElement">
                <div class="plate-left-side">
                    <span class="letter" id="lt1">A</span>
                    <span id="dg1">7</span>
                    <span id="dg2">7</span>
                    <span id="dg3">7</span>
                    <span class="letter" id="lt2">A</span>
                    <span class="letter" id="lt3">A</span>
                </div>
                <div class="plate-right-side">
                    <span class="region-bold-text" id="regBlockCode">77</span>
                    <div class="rus-flag-container">
                        <span>RUS</span>
                        <div class="flag-box-mini">
                            <div class="w"></div>
                            <div class="b"></div>
                            <div class="r"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Подписи условий -->
        <div class="center-labels-list" id="labelsDisplayList">
            <div class="label-row-item">Цифры совпадают с регионом</div>
            <div class="label-row-item">3 одинаковые буквы</div>
            <div class="label-row-item">3 одинаковые цифры</div>
        </div>

        <!-- Меню переключения -->
        <div class="bottom-pill-box">
            <img class="pill-flag-img" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 9 6'><rect fill='%23fff' width='9' height='2'/><rect fill='%230032A0' y='2' width='9' height='2'/><rect fill='%23DA291C' y='4' width='9' height='2'/></svg>">
            <span>Россия 2 типа</span>
        </div>
        <a href="#" class="sub-link-label">Показать оригинал</a>
    </div>

    <script>
        let walletCash = parseInt(localStorage.getItem('m_cash_orig')) || 14696357;
        let highRecord = parseInt(localStorage.getItem('m_rec_orig')) || 32681250;
        let activePrice = 32681250;
        let rotationState = false;

        const lettersArr = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const regionsArr = ['77', '99', '177', '777', '799', '78', '98', '178', '198', '50', '90'];

        const plateTriggerBox = document.getElementById('plateTriggerBox');
        const sellActionLink = document.getElementById('sellActionLink');
        const cashDisplay = document.getElementById('cashDisplay');
        const recordLabel = document.getElementById('recordLabel');
        const priceLabelText = document.getElementById('priceLabelText');
        const rarityTextLabel = document.getElementById('rarityTextLabel');
        const dotsGrid = document.getElementById('dotsGrid');
        const labelsDisplayList = document.getElementById('labelsDisplayList');
        const plateCoreElement = document.getElementById('plateCoreElement');

        cashDisplay.innerText = walletCash.toLocaleString('ru-RU') + ' ₽';
        recordLabel.innerHTML = highRecord.toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₽!';
        priceLabelText.innerText = activePrice.toLocaleString('ru-RU') + ' ₽';

        plateTriggerBox.addEventListener('click', processSpinAction);
        sellActionLink.addEventListener('click', (e) => { e.preventDefault(); makeSale(); });

        function createRandomPack() {
            return {
                l1: lettersArr[Math.floor(Math.random() * lettersArr.length)],
                l2: lettersArr[Math.floor(Math.random() * lettersArr.length)],
                l3: lettersArr[Math.floor(Math.random() * lettersArr.length)],
                d1: Math.floor(Math.random() * 10),
                d2: Math.floor(Math.random() * 10),
                d3: Math.floor(Math.random() * 10),
                rg: regionsArr[Math.floor(Math.random() * regionsArr.length)]
            };
        }

        function processSpinAction() {
            if (rotationState) return;
            rotationState = true;
            plateCoreElement.classList.add('plate-spin-shake');

            let step = 0;
            const timer = setInterval(() => {
                let t = createRandomPack();
                document.getElementById('lt1').innerText = t.l1;
                document.getElementById('dg1').innerText = t.d1;
                document.getElementById('dg2').innerText = t.d2;
                document.getElementById('dg3').innerText = t.d3;
                document.getElementById('lt2').innerText = t.l2;
                document.getElementById('lt3').innerText = t.l3;
                document.getElementById('regBlockCode').innerText = t.rg;
                step++;

                if (step > 13) {
                    clearInterval(timer);
                    plateCoreElement.classList.remove('plate-spin-shake');

                    let f = createRandomPack();
                    let matches = [];
                    let multiplier = 1;
                    let configObj = { text: "Обычный", color: "#8e8e93", dotsCount: 1 };

                    const comboNums = (f.d1 === f.d2 && f.d2 === f.d3);
                    const comboLets = (f.l1 === f.l2 && f.l2 === f.l3);
                    const rawNums = `${f.d1}${f.d2}${f.d3}`;
                    const comboReg = (rawNums === f.rg || `7${rawNums}` === f.rg);

                    if (comboLets) {
                        matches.push("3 одинаковые буквы");
                        multiplier *= 350;
                        configObj = { text: "Редкий", color: "#3b82f6", dotsCount: 3 };
                    }
                    if (comboNums) {
                        matches.push("3 одинаковые цифры");
                        multiplier *= 1600;
                        configObj = { text: "Эпический", color: "#9a69fa", dotsCount: 4 };
                    }
                    if (comboReg) {
                        matches.push("Цифры совпадают с регионом");
                        multiplier *= 8000;
                        configObj = { text: "Легендарный", color: "#e5b842", dotsCount: 5 };
                    }

                    // Имитируем подкрутку рекорда из скриншота с шансом 14%
                    if (Math.random() < 0.14) {
                        f.d1 = 7; f.d2 = 7; f.d3 = 7;
                        f.l1 = 'А'; f.l2 = 'А'; f.l3 = 'А'; f.rg = '77';
                        matches = ["Цифры совпадают с регионом", "3 одинаковые буквы", "3 одинаковые цифры"];
                        multiplier = 22232;
                        configObj = { text: "Легендарный", color: "#e5b842", dotsCount: 5 };
                    }

                    document.getElementById('lt1').innerText = f.l1;
                    document.getElementById('dg1').innerText = f.d1;
                    document.getElementById('dg2').innerText = f.d2;
                    document.getElementById('dg3').innerText = f.d3;
                    document.getElementById('lt2').innerText = f.l2;
                    document.getElementById('lt3').innerText = f.l3;
                    document.getElementById('regBlockCode').innerText = f.rg;

                    activePrice = (Math.floor(Math.random() * 100) + 1470) * multiplier;
                    priceLabelText.innerText = activePrice.toLocaleString('ru-RU') + ' ₽';

                    rarityTextLabel.innerText = configObj.text;
                    rarityTextLabel.style.color = configObj.color;

                    dotsGrid.innerHTML = "";
                    for (let i = 0; i < configObj.dotsCount; i++) {
                        let bar = document.createElement('div');
                        bar.className = "rarity-dot-item";
                        bar.style.background = configObj.color;
                        dotsGrid.appendChild(bar);
                    }

                    labelsDisplayList.innerHTML = "";
                    if (matches.length === 0) matches.push("Обычное сочетание");
                    matches.forEach(mText => {
                        let div = document.createElement('div');
                        div.className = "label-row-item";
                        div.innerText = mText;
                        labelsDisplayList.appendChild(div);
                    });

                    if (activePrice > highRecord) {
                        highRecord = activePrice;
                        recordLabel.innerHTML = highRecord.toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₽!';
                        localStorage.setItem('m_rec_orig', highRecord);
                    }

                    rotationState = false;
                }
            }, 55);
        }

        function makeSale() {
            walletCash += activePrice;
            cashDisplay.innerText = walletCash.toLocaleString('ru-RU') + ' ₽';
            localStorage.setItem('m_cash_orig', walletCash);
            priceLabelText.innerText = "0 ₽";
            labelsDisplayList.innerHTML = '<div class="label-row-item">Номер успешно продан!</div>';
        }
    </script>
</body>
</html>
