<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Генератор Номеров 3.1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }

        /* Верхнее меню и баланс */
        .header-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 5px 0 15px 0;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        .wallet-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance {
            font-size: 16px;
            color: #b3b3b3;
            font-weight: 500;
        }

        .diamonds {
            font-size: 16px;
            color: #b3b3b3;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Верхний баннер рекорда один в один */
        .record-box {
            background: #251c0c;
            border: 1.5px solid #d4af37;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            width: 100%;
        }

        .record-info {
            font-size: 13px;
            color: #ebdcb9;
            line-height: 1.4;
        }

        .record-info strong {
            color: #ffffff;
        }

        .record-link {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Статус редкости */
        .rarity-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            padding-left: 4px;
            margin-bottom: 4px;
        }

        .rarity-title {
            font-size: 14px;
            color: #b48aef; /* Фиолетовый по умолчанию */
            font-weight: bold;
            margin-bottom: 2px;
        }

        .rarity-dots {
            display: flex;
            gap: 3px;
        }

        .dot {
            width: 8px;
            height: 3px;
            background: #b48aef;
            border-radius: 1px;
        }

        /* Цена крупно */
        .price-display {
            font-size: 26px;
            font-weight: bold;
            color: #ca8a04;
            text-align: right;
            width: 100%;
            margin-bottom: 12px;
            padding-right: 4px;
        }

        /* Оригинальный автомобильный номер знака */
        .plate-frame {
            background: #1e1e1e;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            width: 100%;
            margin-bottom: 20px;
        }

        .plate-inner {
            background: #ffffff;
            color: #000000;
            border-radius: 4px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border: 3px solid #000000;
        }

        .plate-left-side {
            font-size: 52px;
            display: flex;
            align-items: center;
            gap: 2px;
            font-family: monospace;
            font-weight: 900;
        }

        .plate-left-side .font-fix {
            font-size: 34px;
            margin-top: 14px;
            font-family: -apple-system, sans-serif;
        }

        .plate-right-side {
            border-left: 3px solid #000;
            height: 100%;
            width: 78px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 6px;
        }

        .reg-code {
            font-size: 34px;
            line-height: 1;
            font-weight: 800;
            font-family: monospace;
        }

        .rus-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 900;
            margin-top: 2px;
        }

        .flag-element {
            width: 14px;
            height: 9px;
            display: flex;
            flex-direction: column;
            border: 0.5px solid #999;
        }
        .flag-element .f-w { background: #fff; flex: 1; }
        .flag-element .f-b { background: #0024a5; flex: 1; }
        .flag-element .f-r { background: #e30000; flex: 1; }
        /* Текст описания под номером */
        .tags-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            width: 100%;
            margin-bottom: 40px;
            min-height: 70px;
        }

        .tag-line {
            font-size: 14px;
            color: #888888;
            font-weight: 400;
        }

        /* Нижний таб-бар выбора режима */
        .bottom-selector {
            background: #1a1a1c;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: auto;
            cursor: pointer;
            border: 1px solid #242426;
        }

        .selector-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #ffffff;
        }

        .selector-flag {
            width: 20px;
            height: 13px;
            border: 0.5px solid #444;
        }

        .selector-right {
            font-size: 13px;
            color: #777779;
        }

        /* Главная кнопка «Крутить» / «Продать» */
        .big-action-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .big-action-btn.sell-state {
            background: #ca8a04;
            color: #ffffff;
        }

        .shake-effect {
            animation: mini-shake 0.05s infinite alternate;
        }
        @keyframes mini-shake {
            0% { transform: translateY(-1px); }
            100% { transform: translateY(1px); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Верхнее меню и кошелек -->
        <div class="header-menu">
            <span class="menu-icon">☰</span>
            <div class="wallet-container">
                <span class="balance" id="moneyText">0 ₽</span>
                <span class="diamonds">🔹 0</span>
            </div>
        </div>

        <!-- Рекорд один в один -->
        <div class="record-box">
            <div class="record-info">
                Новый рекорд: номер за <br>
                <strong id="recordText">0 ₽</strong>
            </div>
            <a href="#" class="record-link" id="sellBtn">Открыть ➔</a>
        </div>

        <!-- Редкость -->
        <div class="rarity-section">
            <span class="rarity-title" id="rarityLabel">Обычный</span>
            <div class="rarity-dots" id="dotsBox">
                <div class="dot"></div>
            </div>
        </div>

        <!-- Стоимость текущего номера -->
        <div class="price-display" id="priceText">0 ₽</div>

        <!-- Автомобильный знак -->
        <div class="plate-frame">
            <div class="plate-inner" id="plateAnimateBox">
                <div class="plate-left-side">
                    <span class="font-fix" id="b1">А</span>
                    <span id="v1">0</span>
                    <span id="v2">0</span>
                    <span id="v3">1</span>
                    <span class="font-fix" id="b2">М</span>
                    <span class="font-fix" id="b3">Р</span>
                </div>
                <div class="plate-right-side">
                    <span class="reg-code" id="regionText">77</span>
                    <div class="rus-label">
                        <span>RUS</span>
                        <div class="flag-element">
                            <div class="f-w"></div>
                            <div class="f-b"></div>
                            <div class="f-r"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Подписи совпадений -->
        <div class="tags-container" id="labelsBox">
            <div class="tag-line">Нажмите кнопку снизу для генерации</div>
        </div>

        <!-- Главная кнопка -->
        <button class="big-action-btn" id="spinBtn">Крутить (-100 ₽)</button>

        <!-- Нижняя плашка режима -->
        <div class="bottom-selector">
            <div class="selector-left">
                <img class="selector-flag" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 9 6'><rect fill='%23fff' width='9' height='2'/><rect fill='%230032A0' y='2' width='9' height='2'/><rect fill='%23DA291C' y='4' width='9' height='2'/></svg>">
                <span>Россия 2 типа</span>
            </div>
            <span class="selector-right">Показать оригинал</span>
        </div>
    </div>
    <script>
        // Игровой баланс и рекорд
        let wallet = parseInt(localStorage.getItem('m_wallet')) || 15000;
        let record = parseInt(localStorage.getItem('m_record')) || 0;
        let currentPrice = 0;
        let isReadyToSell = false;

        const rusLetters = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const rusRegions = ['77', '99', '177', '777', '799', '97', '78', '98', '178', '198', '50', '90'];

        const spinBtn = document.getElementById('spinBtn');
        const sellBtn = document.getElementById('sellBtn');
        const moneyText = document.getElementById('moneyText');
        const recordText = document.getElementById('recordText');
        const priceText = document.getElementById('priceText');
        const rarityLabel = document.getElementById('rarityLabel');
        const dotsBox = document.getElementById('dotsBox');
        const labelsBox = document.getElementById('labelsBox');
        const plateAnimateBox = document.getElementById('plateAnimateBox');

        // Вывод при старте
        moneyText.innerText = wallet.toLocaleString('ru-RU') + ' ₽';
        recordText.innerText = record.toLocaleString('ru-RU') + ' ₽';

        spinBtn.addEventListener('click', handleAction);
        sellBtn.addEventListener('click', (e) => { e.preventDefault(); sellPlate(); });

        function handleAction() {
            if (isReadyToSell) {
                sellPlate();
            } else {
                startSpin();
            }
        }

        function generateData() {
            return {
                c1: rusLetters[Math.floor(Math.random() * rusLetters.length)],
                c2: rusLetters[Math.floor(Math.random() * rusLetters.length)],
                c3: rusLetters[Math.floor(Math.random() * rusLetters.length)],
                n1: Math.floor(Math.random() * 10),
                n2: Math.floor(Math.random() * 10),
                n3: Math.floor(Math.random() * 10),
                reg: rusRegions[Math.floor(Math.random() * rusRegions.length)]
            };
        }

        function evaluatePlate(p) {
            let base = Math.floor(Math.random() * 300) + 150;
            let tags = [];
            let mult = 1;
            
            // Настройки редкости по умолчанию
            let config = { name: "Обычный", color: "#9ca3af", dots: 1 };

            const isTripleNum = (p.n1 === p.n2 && p.n2 === p.n3);
            const isTripleLet = (p.c1 === p.c2 && p.c2 === p.c3);
            const numStr = `${p.n1}${p.n2}${p.n3}`;
            const isRegMatch = (numStr === p.reg || `7${numStr}` === p.reg);

            if (isTripleLet) {
                tags.push("3 одинаковые буквы");
                mult *= 450;
                config = { name: "Редкий", color: "#60a5fa", dots: 3 };
            }
            if (isTripleNum) {
                tags.push("3 одинаковые цифры");
                mult *= 1800;
                config = { name: "Эпический", color: "#b48aef", dots: 4 };
            }
            if (isRegMatch) {
                tags.push("Цифры совпадают с регионом");
                mult *= 8500;
                config = { name: "Легендарный", color: "#ca8a04", dots: 5 };
            }

            // Комбинация А777АА 77 как на твоем скриншоте
            if (isTripleNum && p.n1 === 7 && isTripleLet) {
                tags.push("Цифры совпадают с регионом");
                tags.push("3 одинаковые буквы");
                tags.push("3 одинаковые цифры");
                mult *= 15000;
                config = { name: "Легендарный", color: "#ca8a04", dots: 5 };
            }

            if (tags.length === 0) tags.push("Обычное сочетание");

            return { price: base * mult, tags: tags, config: config };
        }

        function startSpin() {
            if (wallet < 100) {
                alert("Баланс пополнен пособием игры на 10 000 ₽!");
                wallet = 10000;
                moneyText.innerText = wallet.toLocaleString('ru-RU') + ' ₽';
                localStorage.setItem('m_wallet', wallet);
                return;
            }

            wallet -= 100;
            moneyText.innerText = wallet.toLocaleString('ru-RU') + ' ₽';
            localStorage.setItem('m_wallet', wallet);

            spinBtn.disabled = true;
            plateAnimateBox.classList.add('shake-effect');

            let count = 0;
            const timer = setInterval(() => {
                let rnd = generateData();
                document.getElementById('b1').innerText = rnd.c1;
                document.getElementById('v1').innerText = rnd.n1;
                document.getElementById('v2').innerText = rnd.n2;
                document.getElementById('v3').innerText = rnd.n3;
                document.getElementById('b2').innerText = rnd.c2;
                document.getElementById('b3').innerText = rnd.c3;
                document.getElementById('regionText').innerText = rnd.reg;
                count++;

                if (count > 14) {
                    clearInterval(timer);
                    plateAnimateBox.classList.remove('shake-effect');

                    let final = generateData();
                    // Шанс подкрутить Легендарку для фана (15%)
                    if (Math.random() < 0.15) {
                        final.n1 = 7; final.n2 = 7; final.n3 = 7;
                        final.c1 = 'А'; final.c2 = 'А'; final.c3 = 'А';
                        final.reg = '77';
                    }

                    document.getElementById('b1').innerText = final.c1;
                    document.getElementById('v1').innerText = final.n1;
                    document.getElementById('v2').innerText = final.n2;
                    document.getElementById('v3').innerText = final.n3;
                    document.getElementById('b2').innerText = final.c2;
                    document.getElementById('b3').innerText = final.c3;
                    document.getElementById('regionText').innerText = final.reg;

                    let res = evaluatePlate(final);
                    currentPrice = res.price;

                    // Отрисовка цены и статуса под оригинал
                    priceText.innerText = currentPrice.toLocaleString('ru-RU') + ' ₽';
                    rarityLabel.innerText = res.config.name;
                    rarityLabel.style.color = res.config.color;

                    // Рисуем деления редкости
                    dotsBox.innerHTML = "";
                    for(let i=0; i<res.config.dots; i++) {
                        let d = document.createElement('div');
                        d.className = "dot";
                        d.style.background = res.config.color;
                        dotsBox.appendChild(d);
                    }

                    // Вывод текстовых подписей совпадений
                    labelsBox.innerHTML = "";
                    res.tags.forEach(t => {
                        let l = document.createElement('div');
                        l.className = "tag-line";
                        l.innerText = t;
                        labelsBox.appendChild(l);
                    });

                    // Сохранение рекорда
                    if (currentPrice > record) {
                        record = currentPrice;
                        recordText.innerText = record.toLocaleString('ru-RU') + ' ₽';
                        localStorage.setItem('m_record', record);
                    }

                    // Меняем режим кнопки на Продажу
                    isReadyToSell = true;
                    spinBtn.innerText = "Продать номер";
                    spinBtn.classList.add('sell-state');
                    spinBtn.disabled = false;
                }
            }, 60);
        }

        function sellPlate() {
            wallet += currentPrice;
            moneyText.innerText = wallet.toLocaleString('ru-RU') + ' ₽';
            localStorage.setItem('m_wallet', wallet);

            isReadyToSell = false;
            spinBtn.innerText = "Крутить (-100 ₽)";
            spinBtn.classList.remove('sell-state');
            priceText.innerText = "Продано!";
        }
    </script>
</body>
</html>
