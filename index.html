<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Мульти-Симулятор Номеров</title>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #1e1e26 0%, #0a0a0c 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 365px;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* Навигация */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 2px 14px 2px;
        }

        .burger-menu {
            color: #858589;
            font-size: 26px;
            cursor: pointer;
        }

        .balance-display {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Боковая шторка меню */
        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100vh;
            background: #131315;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            z-index: 99;
            transition: left 0.3s ease;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-menu.active { left: 0; }

        .menu-title {
            font-size: 16px;
            font-weight: bold;
            color: #e5b842;
            margin: 10px 0 5px 0;
            border-bottom: 1px solid #242426;
            padding-bottom: 5px;
        }

        .select-input {
            width: 100%;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .overlay-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 98;
            display: none;
        }

        /* Баннер Рекорда */
        .rec-banner {
            background: #19140a;
            border: 1px solid #4a3b1a;
            border-radius: 10px;
            padding: 11px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 45px;
        }

        .rec-text { font-size: 12.5px; color: #cbb88a; line-height: 1.4; }
        .rec-btn { color: #e5b842; font-size: 13px; font-weight: bold; text-decoration: none; }

        /* Полоски редкости */
        .rarity-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        .rarity-meta { display: flex; flex-direction: column; align-items: flex-start; }
        .rarity-txt { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .dashes-grid { display: flex; gap: 2.5px; }
        .dash-line { width: 12px; height: 3px; border-radius: 1px; }
        .price-label { font-size: 23px; font-weight: bold; color: #e5b842; }
        /* Внешний вид пластин */
        .plate-container {
            background: #141416;
            padding: 3px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 26px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .plate-sheet {
            background: #f2f2f4;
            color: #000000;
            border-radius: 4px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border: 3px solid #111111;
            font-family: 'PT Sans Narrow', sans-serif;
            font-weight: 700;
        }

        /* Специфика номера РФ */
        .rus-left { display: flex; align-items: baseline; }
        .rus-left .b-num { font-size: 62px; line-height: 1; letter-spacing: -2px; }
        .rus-left .s-let { font-size: 34px; line-height: 1; margin: 0 1px; }
        .rus-right { border-left: 3px solid #111111; height: 100%; width: 70px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px 0 2px 2px; }
        .rus-right .reg { font-size: 40px; line-height: 0.85; }

        /* Специфика номера Беларуси */
        .by-layout { display: flex; width: 100%; justify-content: space-between; align-items: center; height: 100%; }
        .by-left-flag { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; gap: 2px; border-right: 2.5px solid #111111; height: 100%; padding-right: 8px; }
        .by-flag-ico { width: 16px; height: 10px; background: linear-gradient(to bottom, #dd0000 65%, #009933 65%); position: relative; }
        .by-flag-ico::before { content:''; position:absolute; left:0; top:0; width:3px; height:100%; background:#fff; border-right:0.5px solid red; }
        .by-center-chars { font-size: 56px; display: flex; gap: 3px; letter-spacing: -1px; width: 100%; justify-content: center; align-items: center; }
        .by-center-chars .by-let { font-size: 38px; }
        .by-right-region { font-size: 52px; font-weight: 900; padding-left: 4px; border-left: 2.5px solid #111111; height: 100%; display: flex; align-items: center; }

        .flag-box { width: 14px; height: 9px; display: flex; flex-direction: column; border: 0.5px solid #555; }
        .flag-box .w { background: #fff; flex: 1; }
        .flag-box .b { background: #0024a5; flex: 1; }
        .flag-box .r { background: #e30000; flex: 1; }

        .conditions-box { display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; min-height: 90px; }
        .condition-text { font-size: 14px; color: #555559; font-weight: 500; text-align: center; }

        .bottom-pill { background: #18181a; border-radius: 16px; padding: 8px 14px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #ffffff; border: 1px solid #242426; width: fit-content; margin: 40px auto 2px auto; }
        .shake { animation: vibr 0.04s infinite alternate; }
        @keyframes vibr { 0% { transform: translateY(-0.5px); } 100% { transform: translateY(0.5px); } }
    </style>
</head>
<body>

    <div class="overlay-bg" id="menuOverlay"></div>
    
    <!-- Настройки систем -->
    <div class="sidebar-menu" id="sidebarMenu">
        <div class="menu-title">Выбор Страны Номеров</div>
        <select class="select-input" id="countrySelect" onchange="changeCountry()">
            <option value="RU">🇷🇺 Россия (ГОСТ)</option>
            <option value="BY">🇧🇾 Беларусь (4 цифры - 2 буквы)</option>
        </select>

        <div class="menu-title">Игровая Валюта</div>
        <select class="select-input" id="currencySelect" onchange="changeCurrency()">
            <option value="RUB">Российский рубль (₽)</option>
            <option value="BYN">Белорусский рубль (Br)</option>
            <option value="USD">Доллар США ($)</option>
            <option value="EUR">Евро (€)</option>
        </select>
        <p style="font-size:11px; color:#5559; margin-top:10px;">Прогресс и миллионы сохраняются автоматически!</p>
    </div>

    <div class="app-container">
        <div class="top-navbar">
            <span class="burger-menu" id="openMenuBtn">☰</span>
            <div class="balance-display" id="balanceText">0 ₽</div>
        </div>

        <div class="rec-banner">
            <div class="rec-text">Новый рекорд: номер за <span id="recordLabel">0 ₽</span></div>
            <a href="#" class="rec-btn" id="sellBtn">Открыть ➔</a>
        </div>

        <div class="rarity-row">
            <div class="rarity-meta">
                <span class="rarity-txt" id="rarityTitle" style="color: #e5b842;">Легендарный</span>
                <div class="dashes-grid" id="dashesBox"></div>
            </div>
            <div class="price-label" id="priceText">0 ₽</div>
        </div>

        <div class="plate-container" id="spinArea">
            <div class="plate-sheet" id="plateCore">
                <!-- Контент генерируется скриптом динамически (РФ или РБ) -->
            </div>
        </div>

        <div class="conditions-box" id="tagsBox">
            <div class="condition-text">Нажми на номер для проверки удачи</div>
        </div>

        <div class="bottom-pill">🎰 Мульти-Режим Симулятора</div>
    </div>
    <script>
        // Коэффициенты обмена валют (относительно базового Рубля)
        const rates = { RUB: 1, BYN: 0.035, USD: 0.011, EUR: 0.010 };
        const signs = { RUB: ' ₽', BYN: ' Br', USD: ' \$', EUR: ' €' };

        let currentCountry = localStorage.getItem('sim_country') || 'RU';
        let currentCurrency = localStorage.getItem('sim_currency') || 'RUB';
        let baseMoney = parseInt(localStorage.getItem('sim_base_cash')) || 15000000; // Стартовые 15 млн
        let baseRecord = parseInt(localStorage.getItem('sim_base_rec')) || 0;
        
        let lastPriceBase = 0;
        let spinning = false;

        const lettersRU = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const lettersBY = ['А', 'В', 'Е', 'І', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];

        // Элементы UI
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const balanceText = document.getElementById('balanceText');
        const recordLabel = document.getElementById('recordLabel');
        const priceText = document.getElementById('priceText');
        const rarityTitle = document.getElementById('rarityTitle');
        const dashesBox = document.getElementById('dashesBox');
        const tagsBox = document.getElementById('tagsBox');
        const plateCore = document.getElementById('plateCore');

        document.getElementById('openMenuBtn').addEventListener('click', () => { sidebarMenu.classList.add('active'); menuOverlay.style.display = 'block'; });
        menuOverlay.addEventListener('click', () => { sidebarMenu.classList.remove('active'); menuOverlay.style.display = 'none'; });

        // Инициализация настроек селекторов
        document.getElementById('countrySelect').value = currentCountry;
        document.getElementById('currencySelect').value = currentCurrency;
        
        updateTopBar();
        renderStaticPlate();

        function updateTopBar() {
            balanceText.innerText = (baseMoney * rates[currentCurrency]).toLocaleString('ru-RU', {maximumFractionDigits: 0}) + signs[currentCurrency];
            recordLabel.innerText = (baseRecord * rates[currentCurrency]).toLocaleString('ru-RU', {maximumFractionDigits: 0}) + signs[currentCurrency];
        }

        function changeCountry() {
            currentCountry = document.getElementById('countrySelect').value;
            localStorage.setItem('sim_country', currentCountry);
            renderStaticPlate();
        }

        function changeCurrency() {
            currentCurrency = document.getElementById('currencySelect').value;
            localStorage.setItem('sim_currency', currentCurrency);
            updateTopBar();
            priceText.innerText = (lastPriceBase * rates[currentCurrency]).toLocaleString('ru-RU', {maximumFractionDigits: 0}) + signs[currentCurrency];
        }

        function renderStaticPlate() {
            if(currentCountry === 'RU') {
                plateCore.innerHTML = `<div class="rus-left"><span class="s-let">А</span><span class="b-num">777</span><span class="s-let">А</span><span class="s-let">А</span></div><div class="rus-right"><span class="reg">77</span><div class="rus-flag-group"><span style="font-size:8px;font-weight:900;">RUS</span><div class="flag-box"><div class="w"></div><div class="b"></div><div class="r"></div></div></div></div>`;
            } else {
                plateCore.innerHTML = `<div class="by-layout"><div class="by-left-flag"><div class="by-flag-ico"></div><span>BY</span></div><div class="by-center-chars">7777<span class="by-let">А</span><span class="by-let">А</span></div><div class="by-right-region">7</div></div>`;
            }
        }

        document.getElementById('spinArea').addEventListener('click', startSpin);
        document.getElementById('sellBtn').addEventListener('click', (e) => { e.preventDefault(); sellCurrentPlate(); });

        function getRandomPack() {
            let list = currentCountry === 'RU' ? lettersRU : lettersBY;
            return {
                l1: list[Math.floor(Math.random() * list.length)], l2: list[Math.floor(Math.random() * list.length)], l3: list[Math.floor(Math.random() * list.length)],
                d1: Math.floor(Math.random() * 10), d2: Math.floor(Math.random() * 10), d3: Math.floor(Math.random() * 10), d4: Math.floor(Math.random() * 10),
                rg: Math.floor(Math.random() * 7) + 1
            };
        }

        function startSpin() {
            if(spinning) return;
            spinning = true;
            plateCore.classList.add('shake');

            let ticks = 0;
            const timer = setInterval(() => {
                let r = getRandomPack();
                updatePlateUI(r);
                ticks++;

                if(ticks > 12) {
                    clearInterval(timer);
                    plateCore.classList.remove('shake');

                    let f = getRandomPack();
                    let luckRoll = Math.random(); // Механика случайных шансов на выпад

                    let mult = 1;
                    let tags = [];
                    let style = { text: "Обычный", color: "#858589", count: 1 };

                    if (luckRoll < 0.03) { // 3% жесткая подкрутка блата
                        f.d1 = 7; f.d2 = 7; f.d3 = 7; f.d4 = 7; f.l1 = 'А'; f.l2 = 'А'; f.l3 = 'А';
                        tags.push("👑 ТОП-1 КОМБИНАЦИЯ УДАЧИ");
                        mult = 18000;
                        style = { text: "Легендарный", color: "#e5b842", count: 5 };
                    } else if (luckRoll < 0.12) { // 9% Эпик комбинации
                        f.d2 = f.d1; f.d3 = f.d1; f.d4 = f.d1;
                        tags.push("Все цифры одинаковые");
                        mult = 3500;
                        style = { text: "Эпический", color: "#9a69fa", count: 4 };
                    } else if (luckRoll < 0.30) { // 18% Редкие
                        f.l2 = f.l1;
                        tags.push("Одинаковая серия букв");
                        mult = 600;
                        style = { text: "Редкий", color: "#3b82f6", count: 3 };
                    } else {
                        tags.push("Обычное совпадение");
                    }

                    updatePlateUI(f);

                    lastPriceBase = (Math.floor(Math.random() * 100) + 1450) * mult;
                    priceText.innerText = (lastPriceBase * rates[currentCurrency]).toLocaleString('ru-RU', {maximumFractionDigits: 0}) + signs[currentCurrency];
                    
                    rarityTitle.innerText = style.text;
                    rarityTitle.style.color = style.color;

                    dashesBox.innerHTML = "";
                    for(let i=0; i<style.count; i++) {
                        let d = document.createElement('div'); d.className="dash-line"; d.style.background = style.color; dashesBox.appendChild(d);
                    }

                    tagsBox.innerHTML = "";
                    tags.forEach(t => {
                        let div = document.createElement('div'); div.className="condition-text"; div.innerText = t; tagsBox.appendChild(div);
                    });

                    if(lastPriceBase > baseRecord) {
                        baseRecord = lastPriceBase;
                        localStorage.setItem('sim_base_rec', baseRecord);
                        updateTopBar();
                    }

                    spinning = false;
                }
            }, 65);
        }

        function updatePlateUI(obj) {
            if(currentCountry === 'RU') {
                plateCore.innerHTML = `<div class="rus-left"><span class="s-let">${obj.l1}</span><span class="b-num">${obj.d1}${obj.d2}${obj.d3}</span><span class="s-let">${obj.l2}</span><span class="s-let">${obj.l3}</span></div><div class="rus-right"><span class="reg">77${obj.rg}</span><div class="rus-flag-group"><span style="font-size:8px;font-weight:900;">RUS</span><div class="flag-box"><div class="w"></div><div class="b"></div><div class="r"></div></div></div></div>`;
            } else {
                plateCore.innerHTML = `<div class="by-layout"><div class="by-left-flag"><div class="by-flag-ico"></div><span>BY</span></div><div class="by-center-chars">${obj.d1}${obj.d2}${obj.d3}${obj.d4}<span class="by-let">${obj.l1}</span><span class="by-let">${obj.l2}</span></div><div class="by-right-region">${obj.rg}</div></div>`;
            }
        }

        function sellCurrentPlate() {
            baseMoney += lastPriceBase;
            localStorage.setItem('sim_base_cash', baseMoney);
            updateTopBar();
            priceText.innerText = "0" + signs[currentCurrency];
            tagsBox.innerHTML = '<div class="condition-text" style="color:#22c55e;">Номер продан на аукционе!</div>';
        }
    </script>
</body>
</html>
