<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Генератор номеров РФ</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent-color: #3b82f6;
            --text-color: #f4f4f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Стиль оригинального автономера РФ */
        .plate-container {
            background: #000;
            padding: 6px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .plate {
            background: #ffffff;
            color: #000000;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            height: 80px;
            border: 2px solid #000;
            position: relative;
            font-weight: 700;
            user-select: none;
        }

        .plate-main {
            font-size: 45px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            height: 100%;
            font-family: monospace, sans-serif;
        }

        .plate-main span {
            display: inline-block;
        }

        .plate-main .letter {
            font-size: 32px;
            margin-top: 5px;
        }

        .plate-right {
            border-left: 2px solid #000;
            height: 100%;
            width: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-left: 5px;
        }

        .region-code {
            font-size: 32px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .country {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 800;
        }

        .flag {
            width: 16px;
            height: 10px;
            display: flex;
            flex-direction: column;
            border: 0.5px solid #ccc;
        }
        .flag-white { background: #fff; flex: 1; }
        .flag-blue { background: #0033aa; flex: 1; }
        .flag-red { background: #dd0000; flex: 1; }

        /* Настройки режимов */
        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            background: #27272a;
            border: 1px solid rgba(255,255,255,0.1);
            color: #a1a1aa;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .history {
            margin-top: 20px;
            text-align: left;
        }

        .history-title {
            font-size: 12px;
            color: #71717a;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .rolling {
            animation: shake 0.05s infinite alternate;
        }
        @keyframes shake {
            0% { transform: translateY(-1px); }
            100% { transform: translateY(1px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Госномер РФ</h1>
        
        <div class="plate-container">
            <div class="plate" id="plate">
                <div class="plate-main">
                    <span class="letter" id="l1">А</span>
                    <span id="n1">7</span>
                    <span id="n2">7</span>
                    <span id="n3">7</span>
                    <span class="letter" id="l2">А</span>
                    <span class="letter" id="l3">А</span>
                </div>
                <div class="plate-right">
                    <div class="region-code" id="region">777</div>
                    <div class="country">
                        <span>RUS</span>
                        <div class="flag">
                            <div class="flag-white"></div>
                            <div class="flag-blue"></div>
                            <div class="flag-red"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modes">
            <button class="mode-btn active" onclick="setMode('all')">🎲 Все подряд</button>
            <button class="mode-btn" onclick="setMode('triple')">💎 Три одинаковых</button>
            <button class="mode-btn" onclick="setMode('ooo')">🔥 Буквы ААА/ООО</button>
            <button class="mode-btn" onclick="setMode('777')">🎰 Только 777</button>
        </div>

        <button class="btn" id="genBtn" onclick="generatePlate()">КРУТИТЬ НОМЕР</button>

        <div class="history">
            <div class="history-title">История выбитых:</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        // Разрешенные буквы в номерах РФ
        const letters = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        // Популярные регионы РФ
        const regions = ['77', '99', '177', '777', '799', '78', '98', '178', '198', '50', '90', '150', '750', '23', '93', '123', '16', '116', '716', '54', '154'];
        
        let currentMode = 'all';
        const history = [];

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getFakeNumber() {
            let l1 = getRandom(letters);
            let l2 = getRandom(letters);
            let l3 = getRandom(letters);
            let n1 = Math.floor(Math.random() * 10);
            let n2 = Math.floor(Math.random() * 10);
            let n3 = Math.floor(Math.random() * 10);
            let reg = getRandom(regions);

            // Обработка режимов
            if (currentMode === 'triple') {
                let num = Math.floor(Math.random() * 10);
                n1 = num; n2 = num; n3 = num;
            } else if (currentMode === 'ooo') {
                let letChoice = getRandom(['А', 'О', 'В', 'М', 'Е']);
                l1 = letChoice; l2 = letChoice; l3 = letChoice;
            } else if (currentMode === '777') {
                n1 = 7; n2 = 7; n3 = 7;
                reg = getRandom(['77', '777', '799']);
            }

            return { l1, n1, n2, n3, l2, l3, reg };
        }

        function generatePlate() {
            const btn = document.getElementById('genBtn');
            const plate = document.getElementById('plate');
            btn.disabled = true;
            plate.classList.add('rolling');

            let ticks = 0;
            const interval = setInterval(() => {
                let res = getFakeNumber();
                document.getElementById('l1').innerText = res.l1;
                document.getElementById('n1').innerText = res.n1;
                document.getElementById('n2').innerText = res.n2;
                document.getElementById('n3').innerText = res.n3;
                document.getElementById('l2').innerText = res.l2;
                document.getElementById('l3').innerText = res.l3;
                document.getElementById('region').innerText = res.reg;
                
                ticks++;
                if (ticks > 15) {
