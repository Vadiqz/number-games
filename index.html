<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Генератор Номеров копия</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #0c0c0c;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .wrapper {
            width: 100%;
            max-width: 375px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Оригинальный топ-бар */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 8px 4px 14px 4px;
        }

        .burger-btn {
            color: #8e8e93;
            font-size: 24px;
            cursor: pointer;
        }

        .currencies {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #8e8e93;
            font-weight: 500;
        }

        .cur-diamonds {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Идеальный баннер рекорда */
        .record-banner-box {
            background: #19140a;
            border: 1px solid #4a3b1a;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 55px;
        }

        .record-inner-text {
            font-size: 13px;
            color: #cbb88a;
            line-height: 1.4;
            font-weight: 400;
        }

        .record-link-arrow {
            color: #e5b842;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        /* Блок редкости и цены на одной линии */
        .rarity-price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .rarity-badge-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .rarity-text-label {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .rarity-lines-grid {
            display: flex;
            gap: 3px;
        }

        .rarity-dash-item {
            width: 14px;
            height: 3px;
            border-radius: 1px;
        }

        .big-price-label {
            font-size: 24px;
            font-weight: 700;
            color: #e5b842;
        }
        /* Идеальный госномер автомобиля один в один */
        .car-plate-border {
            background: #1c1c1e;
            padding: 3px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 28px;
            cursor: pointer;
        }

        .car-plate-white {
            background: #ffffff;
            color: #000000;
            border-radius: 4px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border: 3px solid #000000;
        }

        .digits-letters-left {
            font-size: 54px;
            display: flex;
            align-items: center;
            gap: 2px;
            font-family: 'Courier New', monospace;
            font-weight: 900;
        }

        .digits-letters-left .ios-font-fix {
            font-size: 36px;
            margin-top: 14px;
            font-family: -apple-system, sans-serif;
        }

        .region-section-right {
            border-left: 3px solid #000;
            height: 100%;
            width: 74px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 4px;
        }

        .reg-number-bold {
            font-size: 34px;
            line-height: 1;
            font-weight: 900;
            font-family: 'Courier New', monospace;
        }

        .rus-flag-group {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            font-weight: 900;
            margin-top: 1px;
        }

        .flag-rect {
            width: 14px;
            height: 9px;
            display: flex;
            flex-direction: column;
            border: 0.5px solid #999;
        }
        .flag-rect .line-w { background: #fff; flex: 1; }
        .flag-rect .line-b { background: #0024a5; flex: 1; }
        .flag-rect .line-r { background: #e30000; flex: 1; }

        /* Серые подписи совпадений */
        .matches-list-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            width: 100%;
            min-height: 90px;
            margin-bottom: auto;
        }

        .match-row-text {
            font-size: 15px;
            color: #555558;
            font-weight: 400;
        }

        /* Овальная плашка переключения типов */
        .pill-menu-btn {
            background: #18181a;
            border-radius: 18px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            border: 1px solid #242426;
            width: fit-content;
            margin: 40px auto 4px auto;
        }

        .pill-icon-flag {
            width: 16px;
            height: 10px;
            border: 0.5px solid #333;
        }

        .sub-text-link {
            font-size: 12px;
            color: #555558;
            text-decoration: none;
            text-align: center;
            margin-bottom: 8px;
        }

        .shake-animation {
            animation: plate-vibrate 0.05s infinite alternate;
        }
        @keyframes plate-vibrate {
            0% { transform: translateY(-1px); }
            100% { transform: translateY(1px); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Оригинальный топ бар -->
        <div class="top-nav">
            <span class="burger-btn">☰</span>
            <div class="currencies">
                <span id="cashCount">14 696 357 ₽</span>
                <span class="cur-diamonds">🔹 <span id="gemsCount">0</span></span>
            </div>
        </div>

        <!-- Баннер рекорда один в один -->
        <div class="record-banner-box">
            <div class="record-inner-text">
                Новый рекорд: номер за <span id="recordLabel">32 681 <br>250 ₽!</span>
            </div>
            <a href="#" class="record-link-arrow" id="sellAction">Открыть ➔</a>
        </div>

        <!-- Роу редкости и цены -->
        <div class="rarity-price-row">
            <div class="rarity-badge-block">
                <span class="rarity-text-label" id="rarityTitle" style="color: #e5b842;">Легендарный</span>
                <div class="rarity-lines-grid" id="dashesLayout">
                    <div class="rarity-dash-item" style="background: #e5b842;"></div>
                    <div class="rarity-dash-item" style="background: #e5b842;"></div>
                    <div class="rarity-dash-item" style="background: #e5b842;"></div>
                    <div class="rarity-dash-item" style="background: #e5b842;"></div>
                    <div class="rarity-dash-item" style="background: #e5b842;"></div>
                </div>
            </div>
            <div class="big-price-label" id="priceLabel">32 681 250 ₽</div>
        </div>
        <!-- Клик по номеру крутит барабан -->
        <div class="car-plate-border" id="plateTrigger">
            <div class="car-plate-white" id="plateCore">
                <div class="digits-letters-left">
                    <span class="ios-font-fix" id="charL1">А</span>
                    <span id="charN1">7</span>
                    <span id="charN2">7</span>
                    <span id="charN3">7</span>
                    <span class="ios-font-fix" id="charL2">А</span>
                    <span class="ios-font-fix" id="charL3">А</span>
                </div>
                <div class="region-section-right">
                    <span class="reg-number-bold" id="regionBlock">77</span>
                    <div class="rus-flag-group">
                        <span>RUS</span>
                        <div class="flag-rect">
                            <div class="line-w"></div>
                            <div class="line-b"></div>
                            <div class="line-r"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Текстовые подписи -->
        <div class="matches-list-box" id="matchesDisplay">
            <div class="match-row-text">Цифры совпадают с регионом</div>
            <div class="match-row-text">3 одинаковые буквы</div>
            <div class="match-row-text">3 одинаковые цифры</div>
        </div>

        <!-- Нижний блок меню один в один -->
        <div class="pill-menu-btn">
            <img class="pill-icon-flag" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 9 6'><rect fill='%23fff' width='9' height='2'/><rect fill='%230032A0' y='2' width='9' height='2'/><rect fill='%23DA291C' y='4' width='9' height='2'/></svg>">
            <span>Россия 2 типа</span>
        </div>
        <a href="#" class="sub-text-link">Показать оригинал</a>
    </div>

    <script>
        // Игровые данные из оригинала
        let userCash = parseInt(localStorage.getItem('orig_cash')) || 14696357;
        let bestRecord = parseInt(localStorage.getItem('orig_record_val')) || 32681250;
        let calculatedValue = 32681250;
        let animationActive = false;

        const alphabet = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const mRegions = ['77', '99', '177', '777', '799', '78', '98', '178', '198', '50', '90'];

        const plateTrigger = document.getElementById('plateTrigger');
        const sellAction = document.getElementById('sellAction');
        const cashCount = document.getElementById('cashCount');
        const recordLabel = document.getElementById('recordLabel');
        const priceLabel = document.getElementById('priceLabel');
        const rarityTitle = document.getElementById('rarityTitle');
        const dashesLayout = document.getElementById('dashesLayout');
        const matchesDisplay = document.getElementById('matchesDisplay');
        const plateCore = document.getElementById('plateCore');

        // Вывод при старте страницы
        cashCount.innerText = userCash.toLocaleString('ru-RU') + ' ₽';
        recordLabel.innerHTML = bestRecord.toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₽!';
        priceLabel.innerText = calculatedValue.toLocaleString('ru-RU') + ' ₽';

        // Генерация при клике на сам автомобильный номер
        plateTrigger.addEventListener('click', executeSpin);
        // Продажа по клику на кнопку в баннере рекорда
        sellAction.addEventListener('click', (e) => { e.preventDefault(); processSale(); });

        function makeRandomObj() {
            return {
                l1: alphabet[Math.floor(Math.random() * alphabet.length)],
                l2: alphabet[Math.floor(Math.random() * alphabet.length)],
                l3: alphabet[Math.floor(Math.random() * alphabet.length)],
                d1: Math.floor(Math.random() * 10),
                d2: Math.floor(Math.random() * 10),
                d3: Math.floor(Math.random() * 10),
                rg: mRegions[Math.floor(Math.random() * mRegions.length)]
            };
        }

        function executeSpin() {
            if (animationActive) return;
            animationActive = true;
            plateCore.classList.add('shake-animation');

            let runCount = 0;
            const timerId = setInterval(() => {
                let temp = makeRandomObj();
                document.getElementById('charL1').innerText = temp.l1;
                document.getElementById('charN1').innerText = temp.d1;
                document.getElementById('charN2').innerText = temp.d2;
                document.getElementById('charN3').innerText = temp.d3;
                document.getElementById('charL2').innerText = temp.l2;
                document.getElementById('charL3').innerText = temp.l3;
                document.getElementById('regionBlock').innerText = temp.rg;
                runCount++;

                if (runCount > 13) {
                    clearInterval(timerId);
                    plateCore.classList.remove('shake-animation');

                    let fObj = makeRandomObj();
                    let captions = [];
                    let multiplierVal = 1;
                    
                    // По умолчанию обычный (серый) статус
                    let viewConfig = { text: "Обычный", color: "#8e8e93", count: 1 };

                    const checkNums = (fObj.d1 === fObj.d2 && fObj.d2 === fObj.d3);
                    const checkLets = (fObj.l1 === fObj.l2 && fObj.l2 === fObj.l3);
                    const coreNums = `${fObj.d1}${fObj.d2}${fObj.d3}`;
                    const checkReg = (coreNums === fObj.rg || `7${coreNums}` === fObj.rg);

                    if (checkLets) {
                        captions.push("3 одинаковые буквы");
                        multiplierVal *= 320;
                        viewConfig = { text: "Редкий", color: "#3b82f6", count: 3 };
                    }
                    if (checkNums) {
                        captions.push("3 одинаковые цифры");
                        multiplierVal *= 1500;
                        viewConfig = { text: "Эпический", color: "#9a69fa", count: 4 };
                    }
                    if (checkReg) {
                        captions.push("Цифры совпадают с регионом");
                        multiplierVal *= 7500;
                        viewConfig = { text: "Легендарный", color: "#e5b842", count: 5 };
                    }

                    // Шанс 15% дропнуть чистый рекорд А777АА 77 как со скрина
                    if (Math.random() < 0.15) {
                        fObj.d1 = 7; fObj.d2 = 7; fObj.d3 = 7;
                        fObj.l1 = 'А'; fObj.l2 = 'А'; fObj.l3 = 'А'; fObj.rg = '77';
                        captions = ["Цифры совпадают с регионом", "3 одинаковые буквы", "3 одинаковые цифры"];
                        multiplierVal = 22232;
                        viewConfig = { text: "Легендарный", color: "#e5b842", count: 5 };
                    }

                    document.getElementById('charL1').innerText = fObj.l1;
                    document.getElementById('charN1').innerText = fObj.d1;
                    document.getElementById('charN2').innerText = fObj.d2;
                    document.getElementById('charN3').innerText = fObj.d3;
                    document.getElementById('charL2').innerText = fObj.l2;
                    document.getElementById('charL3').innerText = fObj.l3;
                    document.getElementById('regionBlock').innerText = fObj.rg;

                    calculatedValue = (Math.floor(Math.random() * 150) + 1450) * multiplierVal;
                    priceLabel.innerText = calculatedValue.toLocaleString('ru-RU') + ' ₽';

                    rarityTitle.innerText = viewConfig.text;
                    rarityTitle.style.color = viewConfig.color;

                    dashesLayout.innerHTML = "";
                    for (let i = 0; i < viewConfig.count; i++) {
                        let dash = document.createElement('div');
                        dash.className = "rarity-dash-item";
                        dash.style.background = viewConfig.color;
                        dashesLayout.appendChild(dash);
                    }

                    matchesDisplay.innerHTML = "";
                    if (captions.length === 0) captions.push("Обычное сочетание");
                    captions.forEach(str => {
                        let block = document.createElement('div');
                        block.className = "match-row-text";
                        block.innerText = str;
                        matchesDisplay.appendChild(block);
                    });

                    if (calculatedValue > bestRecord) {
                        bestRecord = calculatedValue;
                        recordLabel.innerHTML = bestRecord.toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₽!';
                        localStorage.setItem('orig_record_val', bestRecord);
                    }

                    animationActive = false;
                }
            }, 55);
        }

        function processSale() {
            userCash += calculatedValue;
            cashCount.innerText = userCash.toLocaleString('ru-RU') + ' ₽';
            localStorage.setItem('orig_cash', userCash);
            priceLabel.innerText = "0 ₽";
            matchesDisplay.innerHTML = '<div class="match-row-text">Номер продан в коллекцию!</div>';
        }
    </script>
</body>
</html>
