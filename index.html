<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Генератор Номеров</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .inputs-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .input-field label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field input {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field input:focus {
            border-color: var(--accent-color);
        }

        .result-box {
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
        }

        .number {
            font-size: 64px;
            font-weight: 800;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s ease;
        }

        .rolling {
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .btn {
            width: 100%;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            background: var(--accent-hover);
        }

        .history {
            margin-top: 20px;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 Генератор Чисел</h1>
        
        <div class="inputs-group">
            <div class="input-field">
                <label for="min">От</label>
                <input type="number" id="min" value="1" pattern="\d*">
            </div>
            <div class="input-field">
                <label for="max">До</label>
                <input type="number" id="max" value="100" pattern="\d*">
            </div>
        </div>

        <div class="result-box">
            <div id="number" class="number">?</div>
        </div>

        <button class="btn" id="generateBtn">СГЕНЕРИРОВАТЬ</button>

        <div class="history">
            <div class="history-title">История:</div>
            <div class="history-tags" id="historyTags"></div>
        </div>
    </div>

    <script>
        const minInput = document.getElementById('min');
        const maxInput = document.getElementById('max');
        const generateBtn = document.getElementById('generateBtn');
        const numberDisplay = document.getElementById('number');
        const historyTags = document.getElementById('historyTags');
        let history = [];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generate() {
            const min = parseInt(minInput.value) || 0;
            const max = parseInt(maxInput.value) || 100;

            if (min >= max) {
                alert('Значение "От" должно быть меньше "До"');
                return;
            }

            // Тактильная отдача для iPhone (если запущено как PWA)
            if (navigator.vibrate) {
                navigator.vibrate(15);
            }

            generateBtn.disabled = true;
            numberDisplay.classList.add('rolling');

            // Эффект крутящегося барабана (анимация)
            let counter = 0;
            const interval = setInterval(() => {
                numberDisplay.innerText = getRandomInt(min, max);
                counter++;
                if (counter > 10) {
                    clearInterval(interval);
                    
                    const finalNumber = getRandomInt(min, max);
                    numberDisplay.innerText = finalNumber;
                    numberDisplay.classList.remove('rolling');
                    generateBtn.disabled = false;

                    // Добавляем в историю
                    updateHistory(finalNumber);
                }
            }, 50);
        }

        function updateHistory(num) {
            history.unshift(num);
            if (history.length > 5) history.pop();

            historyTags.innerHTML = '';
            history.forEach(item => {
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.innerText = item;
                historyTags.appendChild(tag);
            });
        }

        generateBtn.addEventListener('click', generate);
    </script>
</body>
</html>
