<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Номерок | Симулятор</title>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 12px;
            padding-top: calc(10px + env(safe-area-inset-top));
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 365px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .top-status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 14px; }
        .burger-box { position: relative; cursor: pointer; padding: 4px; }
        .burger-line { width: 20px; height: 2.5px; background: #ffffff; margin: 4px 0; border-radius: 2px; }
        .notification-dot { position: absolute; top: 2px; right: 0; width: 7px; height: 7px; background: #ef4444; border-radius: 50%; }
        .level-badge { background: #1c1c1e; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .level-progress { width: 35px; height: 5px; background: #2c2c2e; border-radius: 3px; overflow: hidden; }
        .level-progress-fill { width: 65%; height: 100%; background: #22c55e; }
        .clover-badge { background: #1c1c1e; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .balance-box { text-align: right; }
        .balance-label { font-size: 10px; color: #8e8e93; text-transform: uppercase; font-weight: 600; }
        .balance-value { font-size: 18px; font-weight: 800; }

        .tabs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-bottom: 12px; }
        .tab-btn { background: #2c2c2e; color: #a1a1aa; border: none; padding: 10px 0; border-radius: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: #48484a; color: #ffffff; }
        .tab-btn.shop { background: #e5b842; color: #000000; position: relative; }
        .shop-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 1px solid #e5b842; }

        .main-tab-view { display: none; width: 100%; flex-direction: column; }
        .main-tab-view.active { display: flex; }
        .info-banner { background: linear-gradient(90deg, #1d2a44 0%, #0f172a 100%); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border: 1px solid rgba(59, 130, 246, 0.15); position: relative; text-align: left; }
        .banner-icon-box { width: 32px; height: 32px; background: #2563eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
        .banner-main-text { font-size: 12px; color: #93c5fd; line-height: 1.4; }
        .banner-arrow { position: absolute; right: 14px; color: #64748b; font-size: 14px; }

        .ads-banner { background: #141416; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 25px; border: 1px solid #242426; text-align: left; position: relative; cursor: pointer; }
        .ads-tag { font-size: 9px; color: #71717a; position: absolute; right: 14px; top: 10px; text-transform: uppercase; font-weight: bold; }

        .rarity-price-line { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-bottom: 10px; padding: 0 4px; }
        .rarity-container { display: flex; flex-direction: column; align-items: flex-start; }
        .rarity-text { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .rarity-dashes { display: flex; gap: 3px; }
        .dash-item { width: 15px; height: 3px; border-radius: 1px; background: #2c2c2e; }
        .price-text-value { font-size: 22px; font-weight: bold; }

        .plate-outer { background: #000000; padding: 1px; border-radius: 10px; width: 100%; margin-bottom: 16px; border: 2px solid #2d2d30; }
        .plate-inner-white { background: #f8f8fa; color: #000000; border-radius: 8px; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border: 3.5px solid #000000; font-family: 'PT Sans Narrow', -apple-system, sans-serif; font-weight: 700; }
        .plate-flag-section { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding-right: 12px; border-right: 3px solid #000000; gap: 3px; }
        .by-ornament-flag { width: 18px; height: 11px; background: linear-gradient(to bottom, #d2232a 60%, #009245 60%); position: relative; border: 0.5px solid #888; }
        .by-ornament-flag::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: #ffffff; border-right: 0.5px solid #d2232a; }
        .by-label-green { font-size: 13px; color: #009245; font-weight: 800; line-height: 1; }
        
        .plate-numbers-center { font-size: 56px; display: flex; align-items: center; justify-content: center; width: 100%; letter-spacing: -2px; padding-left: 8px; }
        .plate-numbers-center .letter-pack { font-size: 40px; margin-left: 4px; letter-spacing: 0px; }
        .plate-region-dash { font-size: 56px; font-weight: 700; display: flex; align-items: center; padding-left: 2px; }

        .multipliers-box { display: flex; flex-direction: column; gap: 4px; align-items: center; width: 100%; margin-bottom: 20px; min-height: 55px; }
        .region-subinfo { font-size: 11px; color: #555558; font-weight: 500; }
        .multiplier-row { font-size: 13.5px; color: #8e8e93; font-weight: 500; }
        .blue-x { color: #2563eb; font-weight: bold; }

        .action-buttons-row { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; margin-bottom: auto; }
        .btn-garage { background: #1c1c1e; color: #ffffff; border: none; padding: 10px 24px; border-radius: 18px; font-size: 13.5px; font-weight: bold; cursor: pointer; }
        .btn-share-square { background: #1c1c1e; color: #ffffff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }

        .bottom-bet-panel { display: flex; gap: 8px; width: 100%; margin-top: 25px; }
        .pill-select-btn { background: #1c1c1e; border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: bold; border: 1px solid #2c2c2e; flex: 1; cursor: pointer; }
        .panel-flag-ico { width: 16px; height: 10px; background: linear-gradient(to bottom, #d2232a 60%, #009245 60%); }
        .spin-submit-btn { background: #ffffff; color: #000000; border: none; padding: 14px 16px; border-radius: 16px; font-size: 13.5px; font-weight: bold; flex: 2; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .spin-submit-btn.disabled-state { background: #1c1c1e; color: #48484a; cursor: not-allowed; }

        .mega-menu-overlay { position: fixed; bottom: -100%; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; transition: bottom 0.3s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; justify-content: flex-end; }
        .mega-menu-overlay.active { bottom: 0; }
        .mega-menu-content { background: #1c1c1e; border-radius: 24px 24px 0 0; width: 100%; max-height: 85vh; padding: 20px 16px; overflow-y: auto; color: #ffffff; position: relative; border-top: 1px solid #2c2c2e; }
        .close-handle { width: 36px; height: 4px; background: #48484a; border-radius: 2px; margin: -10px auto 16px auto; cursor: pointer; }
            <!-- Категория: МОЙ АККАУНТ -->
            <div class="menu-category-title">Мой аккаунт</div>
            <div class="menu-list-items">
                <div class="menu-list-row" onclick="showSavedGarage()">
                    <div class="row-left-content"><div class="row-icon-box" style="background:#22c55e;">📊</div><span>Коллекция в памяти</span></div>
                    <span class="row-right-status">открыть ❯</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="top-status-bar">
            <div class="burger-box" id="openMenuBtn">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="notification-dot"></div>
            </div>
            
            <div class="level-badge">
                <span>Ур. 20</span>
                <div class="level-progress"><div class="level-progress-fill"></div></div>
            </div>
            <div class="clover-badge"><span>🍀</span><span>28</span></div>
            <div class="balance-box">
                <div class="balance-value" id="walletDisplay">533 BYN</div>
            </div>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" id="btn-tab-numbers" onclick="switchView('numbers')">Номера</button>
            <button class="tab-btn" id="btn-tab-cars" onclick="switchView('cars')">Машины</button>
            <button class="tab-btn shop" id="btn-tab-shop" onclick="switchView('shop')">Магазин<div class="shop-dot"></div></button>
        </div>

        <div class="main-tab-view active" id="view-numbers">
            <div class="info-banner" onclick="alert('Обновление серии скоро!')"><div class="banner-icon-box">NEW</div><div class="banner-main-text">Серия дня • <strong>регионы 5 Минская о...</strong></div><span class="banner-arrow">❯</span></div>
            <div class="ads-banner" onclick="alert('Переход на твой VPN!')"><span class="ads-tag">Реклама</span><span>⚡</span><div style="font-size:12px;"><strong>ТВОЙ VPN</strong> - самый быстрый впн, который работает!</div></div>
            <div class="rarity-price-line">
                <div class="rarity-container"><span class="rarity-text" id="rarityTitle" style="color:#2563eb;">Редкий</span><div class="rarity-dashes" id="dashesBox"></div></div>
                <div class="price-text-value" id="priceDisplay" style="color:#2563eb;">725 BYN</div>
            </div>
            <div class="plate-outer">
                <div class="plate-inner-white" id="plateCore">
                    <div class="plate-flag-section"><div class="by-ornament-flag"></div><span class="by-label-green">BY</span></div>
                    <div class="plate-numbers-center" id="numCenterBlock">7177<span class="letter-pack">КР</span></div>
                    <div class="plate-region-dash" id="regionBlock">-7</div>
                </div>
            </div>
            <div class="multipliers-box" id="multipliersDisplay"></div>
            <div class="action-buttons-row"><button class="btn-garage" id="saveToGarageBtn">В гараж</button></div>
            <div class="bottom-bet-panel">
                <div class="pill-select-btn"><span>Беларусь</span></div>
                <div class="pill-select-btn"><span>Необычный+</span></div>
                <button class="spin-submit-btn" id="spinBtn"><span>КРУТИТЬ</span><span class="cost-badge">560 BYN</span></button>
            </div>
        </div>
        <div class="main-tab-view" id="view-cars"><div class="list-container"><div class="list-card-item"><div><b>Geely Coolray</b></div><button class="card-item-btn" onclick="alert('Выбрано!')">Выбрать</button></div></div></div>
        <div class="main-tab-view" id="view-shop"><div class="list-container"><div class="list-card-item"><div><b>📦 Контейнер "Минск"</b></div><button class="card-item-btn" onclick="alert('Скоро!')">Купить</button></div></div></div>
    </div>
    <script>
        let balanceBYN = parseInt(localStorage.getItem('b_cash_val')) || 533;
        let savedGarageList = JSON.parse(localStorage.getItem('b_saved_garage')) || [];
        const currentBetCost = 560;
        let lastPlateStr = "7177 КР-7", lastRarityStr = "Редкий", lastPriceVal = 725, spinningState = false;
        const alphabetBY = ['А','В','Е','І','К','М','Н','О','Р','С','Т','У','Х'];
        const megaMenu = document.getElementById('megaMenu'), openMenuBtn = document.getElementById('openMenuBtn'), closeMenuBtn = document.getElementById('closeMenuBtn');
        const spinBtn = document.getElementById('spinBtn'), walletDisplay = document.getElementById('walletDisplay'), priceDisplay = document.getElementById('priceDisplay'), rarityTitle = document.getElementById('rarityTitle'), dashesBox = document.getElementById('dashesBox'), multipliersDisplay = document.getElementById('multipliersDisplay'), numCenterBlock = document.getElementById('numCenterBlock'), regionBlock = document.getElementById('regionBlock'), plateCore = document.getElementById('plateCore');
        openMenuBtn.addEventListener('click', () => megaMenu.classList.add('active'));
        closeMenuBtn.addEventListener('click', () => megaMenu.classList.remove('active'));
        document.getElementById('saveToGarageBtn').addEventListener('click', saveToLocalGarage);
        walletDisplay.innerText = balanceBYN + " BYN";
        updateRarityDashes("#2563eb", 3);
        renderMultipliers("Код 7 • Минск", "Минск — столичный регион ×1.3", "Три семёрки ×300");
        function openShopTab() { megaMenu.classList.remove('active'); switchView('shop'); }
        function switchView(tab) { document.querySelectorAll('.main-tab-view').forEach(el => el.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); document.getElementById('view-' + tab).classList.add('active'); document.getElementById('btn-tab-' + tab).classList.add('active'); }
        function updateRarityDashes(color, count) { dashesBox.innerHTML = ""; for(let i=0; i<5; i++) { let d = document.createElement('div'); d.className = "dash-item"; if(i < count) d.style.background = color; dashesBox.appendChild(d); } }
        function renderMultipliers(sub, m1, m2) { multipliersDisplay.innerHTML = `<div class="region-subinfo">${sub}</div><div class="multiplier-row">${m1}</div><div class="multiplier-row">${m2}</div>`; }
        function runGameSpin() {
            if(balanceBYN < currentBetCost) { balanceBYN += 2500; walletDisplay.innerText = balanceBYN + " BYN"; return; }
            if(spinningState) return; spinningState = true; plateCore.classList.add('shake-effect');
            balanceBYN -= currentBetCost; walletDisplay.innerText = balanceBYN + " BYN";
            let ticks = 0;
            const interval = setInterval(() => {
                numCenterBlock.innerHTML = `${Math.floor(1000 + Math.random() * 9000)}<span class="letter-pack">${alphabetBY[Math.floor(Math.random() * alphabetBY.length)]}${alphabetBY[Math.floor(Math.random() * alphabetBY.length)]}</span>`;
                regionBlock.innerText = `-${Math.floor(Math.random() * 7) + 1}`;
                ticks++;
                if(ticks > 12) {
                    clearInterval(interval); plateCore.classList.remove('shake-effect');
                    let roll = Math.random(), finalNum=7177, fL1='К', fL2='Р', fReg=7, color="#2563eb", dots=3; lastRarityStr="Редкий"; lastPriceVal=725;
                    if(roll < 0.20) { finalNum = 7777; fL1 = 'М'; fL2 = 'И'; lastRarityStr = "Легендарный"; color = "#e5b842"; dots = 5; lastPriceVal = 14250; renderMultipliers("Код 7 • Минск", "Минск — столичный регион ×1.3", "Четыре семерки ×950"); }
                    else { renderMultipliers("Код 7 • Минск", "Минск — столичный регион ×1.3", "Три семёрки ×300"); }
                    lastPlateStr = `${finalNum} ${fL1}${fL2}-${fReg}`;
                    numCenterBlock.innerHTML = `${finalNum}<span class="letter-pack">${fL1}${fL2}</span>`;
                    regionBlock.innerText = `-${fReg}`;
                    balanceBYN += lastPriceVal; walletDisplay.innerText = balanceBYN + " BYN";
                    priceDisplay.innerText = lastPriceVal + " BYN"; priceDisplay.style.color = color;
                    rarityTitle.innerText = lastRarityStr; rarityTitle.style.color = color;
                    updateRarityDashes(color, dots); localStorage.setItem('b_cash_val', balanceBYN); spinningState = false;
                }
            }, 55);
        }
        function saveToLocalGarage() { savedGarageList.unshift({ plate: lastPlateStr, rarity: lastRarityStr }); localStorage.setItem('b_saved_garage', JSON.stringify(savedGarageList)); alert("Сохранено: " + lastPlateStr); }
        function showSavedGarage() { if(savedGarageList.length === 0) { alert("В коллекции пусто."); return; } let str = "Твой гараж:\n"; savedGarageList.forEach((item, i) => { str += (i+1) + ") " + item.plate + " [" + item.rarity + "]\n"; }); alert(str); }
        spinBtn.addEventListener('click', runGameSpin);
    </script>
</body>
</html>
