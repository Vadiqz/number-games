<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Генератор Номеров клон</title>
    <style>
        :root {
            --bg: #0d0d0e;
            --card: #16161a;
            --gold: #d4af37;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .game-container {
            width: 100%;
            max-width: 410px;
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .record-banner {
            background: #1e1b12;
            border: 1px solid #45371c;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 20px;
            text-align: left;
        }

        .record-text {
            font-size: 13px;
            color: #fef08a;
            line-height: 1.4;
        }

        .record-title {
            color: #ca8a04;
            font-weight: 700;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .balance-box {
            font-size: 18px;
            font-weight: 700;
        }

        .rarity-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            background: #27272a;
            color: var(--muted);
        }

        .plate-cost {
            font-size: 26px;
            font-weight: 800;
            color: #eab308;
            margin-bottom: 15px;
            min-height: 32px;
        }

        .plate-wrapper {
            background: #000;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .plate-body {
            background: #ffffff;
            color: #000000;
            border-radius: 6px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border: 3px solid #000000;
        }

        .plate-left {
            font-size: 54px;
            display: flex;
            align-items: center;
            gap: 2px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
        }

        .plate-left .let {
            font-size: 34px;
            margin-top: 14px;
            font-family: -apple-system, sans-serif;
        }

        .plate-right {
            border-left: 3px solid #000;
            height: 100%;
            width: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .reg-num {
            font-size: 36px;
            line-height: 1;
            font-weight: 800;
        }

        .rus-section {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 900;
            margin-top: 3px;
        }

        .flag-box {
            width: 16px;
            height: 10px;
            display: flex;
            flex-direction: column;
            border: 0.5px solid #bbb;
        }
        .flag-box .w { background: #fff; flex: 1; }
        .flag-box .b { background: #0024a5; flex: 1; }
        .flag-box .r { background: #e30000; flex: 1; }

        .combo-tags {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            margin-bottom: 25px;
            min-height: 60px;
        }

        .combo-tag {
            font-size: 14px;
            color: var(--muted);
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .btn-main {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
        }

        .btn-sell {
            background: #22c55e;
            color: #fff;
            display: none;
        }

        .shake-animation {
            animation: plate-shake 0.05s infinite alternate;
        }
        @keyframes plate-shake {
            0% { transform: translateY(-1px); }
            100% { transform: translateY(1px); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="record-banner">
            <div class="record-text">
                <span class="record-title">Новый рекорд:</span> номер за <br>
                <span id="recordDisplay">0 ₽</span>
            </div>
        </div>

        <div class="top-bar">
            <div class="balance-box" id="walletDisplay">0 ₽</div>
        </div>

        <div class="rarity-badge" id="badgeDisplay">Обычный</div>
        <div class="plate-cost" id="costDisplay">0 ₽</div>

        <div class="plate-wrapper">
            <div class="plate-body" id="plateBox">
                <div class="plate-left">
                    <span class="let" id="c1">А</span>
                    <span id="n1">0</span>
                    <span id="n2">0</span>
                    <span id="n3">1</span>
                    <span class="let" id="c2">М</span>
                    <span class="let" id="c3">Р</span>
                </div>
                <div class="plate-right">
                    <span class="reg-num" id="regDisplay">77</span>
                    <div class="rus-section">
                        <span>RUS</span>
                        <div class="flag-box">
                            <div class="w"></div>
                            <div class="b"></div>
                            <div class="r"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="combo-tags" id="tagsBox">
            <div class="combo-tag">Нажми крутить, чтобы начать игру</div>
        </div>

        <div class="buttons-grid">
            <button class="btn-main btn-sell" id="sellBtn">ПРОДАТЬ НОМЕР</button>
            <button class="btn-main" id="spinBtn">КРУТИТЬ (-100 ₽)</button>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('mitro_balance')) || 5000;
        let maxRecord = parseInt(localStorage.getItem('mitro_record')) || 0;
        let currentPlatePrice = 0;

        const letters = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const regions = ['77', '99', '177', '777', '799', '78', '98', '178', '198', '50', '90'];

        const spinBtn = document.getElementById('spinBtn');
        const sellBtn = document.getElementById('sellBtn');
        const walletDisplay = document.getElementById('walletDisplay');
        const recordDisplay = document.getElementById('recordDisplay');
        const costDisplay = document.getElementById('costDisplay');
        const badgeDisplay = document.getElementById('badgeDisplay');
        const tagsBox = document.getElementById('tagsBox');
        const plateBox = document.getElementById('plateBox');

        walletDisplay.innerText = formatMoney(balance);
        recordDisplay.innerText = formatMoney(maxRecord);

        spinBtn.addEventListener('click', roll);
        sellBtn.addEventListener('click', sellCurrentPlate);

        function formatMoney(num) {
            return num.toLocaleString('ru-RU') + ' ₽';
        }

        function generateRandom() {
            return {
                c1: letters[Math.floor(Math.random() * letters.length)],
                c2: letters[Math.floor(Math.random() * letters.length)],
                c3: letters[Math.floor(Math.random() * letters.length)],
                n1: Math.floor(Math.random() * 10),
                n2: Math.floor(Math.random() * 10),
                n3: Math.floor(Math.random() * 10),
                reg: regions[Math.floor(Math.random() * regions.length)]
            };
        }
        function calculatePlate(p) {
            let basePrice = Math.floor(Math.random() * 400) + 100;
            let descriptions = [];
            let multiplier = 1;
            let rarity = { name: "Обычный", color: "#9ca3af", bg: "#27272a" };

            const isTripleNum = (p.n1 === p.n2 && p.n2 === p.n3);
            const isTripleLet = (p.c1 === p.c2 && p.c2 === p.c3);
            const isMirrorNum = (p.n1 === p.n3 && p.n1 !== p.n2);
            const is001to009 = (p.n1 === 0 && p.n2 === 0 && p.n3 !== 0);
            const numString = `${p.n1}${p.n2}${p.n3}`;
            const isRegionMatch = (numString === p.reg || `7${numString}` === p.reg || `9${numString}` === p.reg);

            if (isTripleNum) {
                descriptions.push("3 одинаковые цифры");
                multiplier *= 1500;
                rarity = { name: "Эпический", color: "#c084fc", bg: "rgba(192, 132, 252, 0.15)" };
            }
            if (isTripleLet) {
                descriptions.push("3 одинаковые буквы");
                multiplier *= 800;
                if(rarity.name !== "Эпический") rarity = { name: "Редкий", color: "#60a5fa", bg: "rgba(96, 165, 250, 0.15)" };
            }
            if (isMirrorNum) {
                descriptions.push("Зеркальные цифры");
                multiplier *= 45;
            }
            if (is001to009) {
                descriptions.push("Малый номер (00X)");
                multiplier *= 900;
                rarity = { name: "Редкий", color: "#60a5fa", bg: "rgba(96, 165, 250, 0.15)" };
            }
            if (isRegionMatch) {
                descriptions.push("Цифры совпадают с регионом");
                multiplier *= 9000;
                rarity = { name: "Легендарный", color: "#facc15", bg: "rgba(250, 204, 21, 0.15)" };
            }

            if (isTripleNum && p.n1 === 7 && isTripleLet) {
                descriptions.push("👑 Комбинация Топ-1");
                multiplier *= 18000;
                rarity = { name: "Легендарный", color: "#facc15", bg: "rgba(250, 204, 21, 0.15)" };
            }

            let finalPrice = basePrice * multiplier;
            if(descriptions.length === 0) descriptions.push("Обычное сочетание");

            return { price: finalPrice, tags: descriptions, rarity: rarity };
        }

        function roll() {
            if (balance < 100) {
                alert("Деньги закончились! Начислено пособие 5,000 ₽.");
                balance = 5000;
                walletDisplay.innerText = formatMoney(balance);
                localStorage.setItem('mitro_balance', balance);
                return;
            }

            balance -= 100;
            walletDisplay.innerText = formatMoney(balance);
            localStorage.setItem('mitro_balance', balance);

            spinBtn.disabled = true;
            sellBtn.style.display = "none";
            plateBox.classList.add('shake-animation');

            let ticks = 0;
            const interval = setInterval(() => {
                let f = generateRandom();
                document.getElementById('c1').innerText = f.c1;
                document.getElementById('n1').innerText = f.n1;
                document.getElementById('n2').innerText = f.n2;
                document.getElementById('n3').innerText = f.n3;
                document.getElementById('c2').innerText = f.c2;
                document.getElementById('c3').innerText = f.c3;
                document.getElementById('regDisplay').innerText = f.reg;
                ticks++;

                if (ticks > 12) {
                    clearInterval(interval);
                    plateBox.classList.remove('shake-animation');

                    let finalPlate = generateRandom();
                    // Шанс подкрутки блатного номера (12%)
                    if(Math.random() < 0.12) {
                        finalPlate.n2 = finalPlate.n1; finalPlate.n3 = finalPlate.n1;
                        finalPlate.c2 = finalPlate.c1; finalPlate.c3 = finalPlate.c1;
                    }

                    document.getElementById('c1').innerText = finalPlate.c1;
                    document.getElementById('n1').innerText = finalPlate.n1;
                    document.getElementById('n2').innerText = finalPlate.n2;
                    document.getElementById('n3').innerText = finalPlate.n3;
                    document.getElementById('c2').innerText = finalPlate.c2;
                    document.getElementById('c3').innerText = finalPlate.c3;
                    document.getElementById('regDisplay').innerText = finalPlate.reg;

                    let evaluation = calculatePlate(finalPlate);
                    currentPlatePrice = evaluation.price;

                    costDisplay.innerText = formatMoney(currentPlatePrice);
                    badgeDisplay.innerText = evaluation.rarity.name;
                    badgeDisplay.style.color = evaluation.rarity.color;
                    badgeDisplay.style.background = evaluation.rarity.bg;

                    tagsBox.innerHTML = "";
                    evaluation.tags.forEach(t => {
                        let d = document.createElement('div');
                        d.className = "combo-tag";
                        d.innerText = t;
                        tagsBox.appendChild(d);
                    });

                    if (currentPlatePrice > maxRecord) {
                        maxRecord = currentPlatePrice;
                        recordDisplay.innerText = formatMoney(maxRecord);
                        localStorage.setItem('mitro_record', maxRecord);
                    }

                    spinBtn.disabled = false;
                    sellBtn.style.display = "block";
                }
            }, 60);
        }

        function sellCurrentPlate() {
            balance += currentPlatePrice;
            walletDisplay.innerText = formatMoney(balance);
            localStorage.setItem('mitro_balance', balance);
            sellBtn.style.display = "none";
            costDisplay.innerText = "Продано!";
        }
    </script>
</body>
</html>
